<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Shopfront</title>

<body>
  <main class="preview">

        <nav class="shop-nav"><strong>FORME</strong><span>Objects for everyday.</span><span>Bag <b id="bag-count">0</b></span></nav>

          <article class="product"><div class="product-art vase" aria-hidden="true"><i></i></div><div class="product-title"><strong>Stone vase</strong><span>€42</span></div><button class="add-product">Add to bag <span>+</span></button></article>
          <article class="product"><div class="product-art stool" aria-hidden="true"><i></i><b></b></div><div class="product-title"><strong>Oak stool</strong><span>€120</span></div><button class="add-product">Add to bag <span>+</span></button></article>
        </div>
        <div class="project-footer"><span>Next.js · React</span><span>shopfront</span></div>
  </main>

</html>
